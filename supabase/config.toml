# Supabase config for Rush Zone — shared backend
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public", "app", "admin", "audit"]
extra_search_path = ["public", "extensions", "app", "admin", "audit"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 15
[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"
[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326
[storage]
enabled = true
port = 54325
file_size_limit = "50MiB"
image_transformation_enabled = true
[auth]
enabled = true
port = 54325
site_url = "http://localhost:3000"
additional_redirect_urls = ["rushzone://", "rushzonecontrol://", "exp://"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = true
enable_manual_linking = true
third_party_auth = { enabled = false }
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
[auth.email.otp]
enabled = true
[auth.sms]
enabled = false
[auth.external.google]
enabled = false
